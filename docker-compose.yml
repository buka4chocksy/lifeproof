name: lifeproof

services:
  postgres:
    image: postgres:16-alpine
    container_name: lifeproof-postgres
    environment:
      POSTGRES_USER: lifeproof
      POSTGRES_PASSWORD: lifeproof
      POSTGRES_DB: lifeproof
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - lifeproof_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lifeproof -d lifeproof"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: lifeproof-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:6381:6379"
    volumes:
      - lifeproof_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  lifeproof_postgres:
  lifeproof_redis:
